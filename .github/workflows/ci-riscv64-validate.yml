name: riscv64 validation (fork only)

# Fork-only: mirror the real build.yml flow. The dist (TypeScript build, which
# uses rolldown and has no riscv64 binding) is produced on x86, then the riscv64
# binary is built natively on the RISE runner from that pre-built dist. Not part
# of the PR.

on:
  push:
    branches: [riscv64-validate]

permissions:
  contents: read

jobs:
  build-dist:
    name: build dist + download llama.cpp (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Build dist (tsc/rolldown on x86)
        run: npm run build
      - name: Download llama.cpp source
        run: node ./dist/cli/cli.js source download --release latest --skipBuild --noBundle --noUsageExample --updateBinariesReleaseMetadataAndSaveGitBundle
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: dist
          path: dist
      - name: Upload llama.cpp source
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: llama
          path: |
            llama/binariesGithubRelease.json
            llama/llama.cpp.info.json
            llama/llama.cpp
            llama/gitRelease.bundle

  native-rise:
    name: native riscv64 build + smoke (RISE runner)
    needs: build-dist
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js (riscv64 unofficial build)
        run: |
          set -e
          NODE_VER=v24.16.0
          curl -fsSL -o /tmp/node.tar.xz "https://unofficial-builds.nodejs.org/download/release/${NODE_VER}/node-${NODE_VER}-linux-riscv64.tar.xz"
          mkdir -p "$HOME/node"
          tar -xJf /tmp/node.tar.xz -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/node/bin:$PATH"
          node --version
          npm --version
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Download llama.cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: llama
          path: llama
      - name: Install build deps (native)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build libtbb-dev
          cmake --version
      - name: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          export PATH="$HOME/node/bin:$PATH"
          npm ci || npm ci || npm ci
      - name: Native riscv64 build (from pre-built dist)
        run: |
          export PATH="$HOME/node/bin:$PATH"
          node ./dist/cli/cli.js source build --ciMode --noUsageExample --arch riscv64 --gpu false
      - name: Verify artifact
        run: |
          set -e
          NODEFILE=$(find ./llama/localBuilds -name "*.node" | head -1)
          echo "binding: $NODEFILE"
          file "$NODEFILE"
          file "$NODEFILE" | grep -q "UCB RISC-V" && echo "RISE_BUILD_OK: $NODEFILE"
